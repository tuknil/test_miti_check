openapi: 3.0.3
info:
  title: mitigation-check API
  version: "1.0"
  description: >
    Fast block/pass proof capability for one candidate mitigation against one
    test basis in one bounded validation substrate (contract `mitigation-check@1.0`).
    On submit the API brings up the substrate container, applies the candidate
    WAF rule, runs the supplied test, resolves a terminal state, and records the
    run (immutable request + response) in a durable ledger.
servers:
  - url: http://localhost:8137
    description: Local / Docker Compose

paths:
  /v1/mitigation-check-runs:
    post:
      summary: Submit and execute a mitigation-check run
      operationId: submitRun
      description: >
        Validates the request against `SubmitMitigationCheckRequest@1`, then
        executes it: start the substrate container, apply the candidate rule,
        run the test, and resolve a terminal state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitMitigationCheckRequest"
            examples:
              truePositive:
                summary: Attack correctly blocked (TP)
                value:
                  contract_id: mitigation-check@1.0
                  candidate_artifact_id: candidate:log4shell:waf-rule:strict
                  test_basis_id: test-basis:log4shell:attack:jndi-ldap
                  check_profile_id: mitigation-check-profile:waf-http:1
                  substrate_selector: substrate:log4j-vulnerable-webserver:container
                  substrate:
                    kind: container-image
                    image: ghcr.io/christophetd/log4shell-vulnerable-app:latest
                    port: 8080
                    vulnerability_id: CVE-2021-44228
                  candidate:
                    kind: waf-rule
                    engine: modsecurity
                    rule_id: "1005440"
                    action: deny
                    rule: >-
                      SecRule REQUEST_HEADERS|REQUEST_URI|ARGS "@rx (?i)\$\{jndi:(?:ldaps?|rmi|dns):/[^}]*\}" "id:1005440,phase:2,deny,status:403"
                  test_basis:
                    kind: http-request-attack
                    proof_basis: verified-vuln-artifact
                    request:
                      method: GET
                      path: /
                      headers:
                        X-Api-Version: "${jndi:ldap://127.0.0.1:1389/a}"
                    expected:
                      classification: true-positive
                      blocked: true
                      status_code: 403
      responses:
        "200":
          description: Run executed; terminal state resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunOutcome"
        "400":
          description: Request does not satisfy the contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      summary: List runs (newest first)
      operationId: listRuns
      responses:
        "200":
          description: Run summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunSummary"

  /v1/mitigation-check-runs/{run_id}:
    get:
      summary: Get one run (immutable request + response)
      operationId: getRun
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
          example: mc-run-a2366a64394de5472eb39642
      responses:
        "200":
          description: The run record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRecord"
        "404":
          description: Run not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /healthz:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    SubmitMitigationCheckRequest:
      type: object
      additionalProperties: false
      required: [contract_id, candidate_artifact_id, test_basis_id, check_profile_id]
      properties:
        contract_id:
          type: string
          enum: ["mitigation-check@1.0"]
        candidate_artifact_id:
          type: string
          minLength: 1
          description: Immutable candidate mitigation reference.
        test_basis_id:
          type: string
          minLength: 1
          description: Attack / discriminator sample reference.
        check_profile_id:
          type: string
          minLength: 1
          description: Signed check profile reference.
        substrate_selector:
          type: string
          description: Logical bounded, non-production substrate (optional).
        execution_mode:
          type: string
          enum: [local, inmemory, firewall, aci, aci-sp, github, github-ghcr]
          default: inmemory
          description: >
            Substrate adapter (defaults to "inmemory" when omitted).
            "local" runs the target on the host Docker daemon;
            "inmemory" runs an in-process stand-in target inside the API (no Docker/cloud);
            "firewall" evaluates an L3/L4 firewall rule against a network-connection
            test in-process (no substrate);
            "aci" runs it as an Azure Container Instance via DefaultAzureCredential;
            "aci-sp" is ACI authenticated with a service principal (env vars);
            "github" dispatches a GitHub Actions workflow that runs the scenario
            and returns the result;
            "github-ghcr" is like github but the API first relays the substrate
            image into the repo's GHCR so the runner needs no source-registry access.
        correlation_id:
          type: string
          description: >
            Optional caller correlation id, echoed into the result envelope's
            correlation_id (omitted from the response when not supplied).
          example: "mc-request:CVE-2021-44228:waf:1"
        substrate:
          $ref: "#/components/schemas/SubstrateSpec"
        candidate:
          $ref: "#/components/schemas/CandidateSpec"
        test_basis:
          $ref: "#/components/schemas/TestBasisSpec"
        upstream_inputs:
          type: array
          description: >
            Upstream-mode input (env MC_INPUT_UPSTREAM). Each entry's result_ref
            points at a Databricks row; the mitigation rule is read from the rule
            entry's result_json.primary_candidate.artifact_content. The test still
            comes from test_basis. In upstream mode contract_id may also be
            "defense-generation@1.0" and the legacy reference ids are not required.
          items:
            $ref: "#/components/schemas/UpstreamInput"
        primary_candidate:
          type: object
          description: >
            Upstream defense-generation candidate; artifact_content carries the
            ModSecurity rule. Accepted so a full defense-generation payload
            validates. In upstream mode the rule is read from Databricks, not here.

    UpstreamInput:
      type: object
      properties:
        capability:
          type: string
          example: defense-generation
        contract_id:
          type: string
          example: defense-generation@1.0
        result_id:
          type: string
        result_ref:
          type: object
          properties:
            system: { type: string, example: databricks }
            catalog: { type: string, example: 36889_janus_dev }
            schema: { type: string, example: defense_generation }
            table: { type: string, example: defense_generation_results }
            key:
              type: string
              example: "defense-generation-result:c3b02e61c65fb24b3fa16aaf"
        evidence_refs:
          type: array
          items:
            type: string

    SubstrateSpec:
      type: object
      description: Inline validation substrate — a bounded, non-production container image.
      required: [kind, image]
      properties:
        kind:
          type: string
          example: container-image
        image:
          type: string
          example: ghcr.io/christophetd/log4shell-vulnerable-app:latest
        digest:
          type: string
        port:
          type: integer
          example: 8080
        vulnerability_id:
          type: string
          example: CVE-2021-44228

    CandidateSpec:
      type: object
      description: Inline candidate mitigation (here, a ModSecurity WAF rule).
      required: [kind, rule]
      properties:
        kind:
          type: string
          example: waf-rule
        engine:
          type: string
          example: modsecurity
        rule_id:
          type: string
          example: "1005440"
        rule:
          type: string
          description: The actual SecRule; its @rx pattern + id/status are applied.
        action:
          type: string
          example: deny

    TestBasisSpec:
      type: object
      required: [kind, proof_basis, expected]
      properties:
        kind:
          type: string
          example: http-request-attack
        proof_basis:
          type: string
          enum: [verified-vuln-artifact, mitigation-discriminator]
        request:
          $ref: "#/components/schemas/TestRequest"
        expected:
          $ref: "#/components/schemas/TestExpected"

    TestRequest:
      type: object
      properties:
        method:
          type: string
          example: GET
        path:
          type: string
          example: /
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string

    TestExpected:
      type: object
      properties:
        classification:
          type: string
          example: true-positive
        blocked:
          type: boolean
        status_code:
          type: integer
          example: 403

    RunOutcome:
      type: object
      description: >
        Result envelope (capability .. evidence_refs) with the full verdict detail
        appended (match .. limitations).
      properties:
        capability:
          type: string
          enum: ["mitigation-check"]
        contract_id:
          type: string
          enum: ["mitigation-check@1.0"]
        run_id:
          type: string
        result_id:
          type: string
        terminal_state:
          type: string
          enum: [blocked, not-blocked, could-not-test, scope-declined, malfunction]
          description: The test result.
        status:
          type: string
          enum: [completed, storage-failed, failed]
          description: >
            Workflow status. "completed" on success; "storage-failed" when the
            Databricks write failed (terminal_state is still the test result);
            "failed" when the run malfunctioned.
        correlation_id:
          type: string
          description: Echoed from the request; omitted when not supplied.
        result_ref:
          $ref: "#/components/schemas/ResultRef"
        evidence_refs:
          type: array
          items:
            type: string
        match:
          type: boolean
          description: Whether actual.blocked equals expected.blocked.
        expected:
          $ref: "#/components/schemas/Outcome"
        actual:
          $ref: "#/components/schemas/ActualOutcome"
        substrate:
          $ref: "#/components/schemas/SubstrateInfo"
        candidate:
          allOf:
            - $ref: "#/components/schemas/CandidateSpec"
          description: >
            The actual mitigation rule that was run (embedded so a mitigation_check
            row is self-contained; consumers need not query the upstream table).
        test_basis:
          allOf:
            - $ref: "#/components/schemas/TestBasisSpec"
          description: The actual test that was run (embedded, same rationale).
        steps:
          type: array
          items:
            type: string
        prose_summary:
          type: string
        limitations:
          type: array
          items:
            type: string

    ResultRef:
      type: object
      description: >
        Pointer to where the full result row is stored so another service can
        query it.
      properties:
        system:
          type: string
          example: databricks
        catalog:
          type: string
        schema:
          type: string
        table:
          type: string
          example: mitigation_check
        key:
          type: string
          description: >
            The result_id value itself — the same string in the top-level result_id
            and in the table's result_id column. Query WHERE result_id = <key>.
          example: "mitigation-check-result:1c40b2497a6f766452572f2c"

    Outcome:
      type: object
      properties:
        classification:
          type: string
        blocked:
          type: boolean
        status_code:
          type: integer

    ActualOutcome:
      type: object
      properties:
        blocked:
          type: boolean
        status_code:
          type: integer
        reached_app:
          type: boolean
        matched_rule_id:
          type: string
        detail:
          type: string

    SubstrateInfo:
      type: object
      properties:
        image:
          type: string
        runner:
          type: string
          enum: [local, inmemory, firewall, aci, aci-sp, github, github-ghcr]
        container_id:
          type: string
        host_port:
          type: integer
        fqdn:
          type: string
          description: ACI public FQDN (aci runner only).
        ready:
          type: boolean

    RunSummary:
      type: object
      properties:
        run_id:
          type: string
        result_id:
          type: string
        terminal_state:
          type: string
        match:
          type: boolean
        created_at:
          type: string
          format: date-time
        summary:
          type: string

    RunRecord:
      type: object
      properties:
        run_id:
          type: string
        result_id:
          type: string
        terminal_state:
          type: string
        match:
          type: boolean
        created_at:
          type: string
          format: date-time
        request:
          $ref: "#/components/schemas/SubmitMitigationCheckRequest"
        response:
          $ref: "#/components/schemas/RunOutcome"

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            category:
              type: string
              example: invalid-input
            message:
              type: string
            fields:
              type: array
              items:
                type: string
