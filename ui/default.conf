server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config must never be cached (regenerated per container start).
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # HTML must always revalidate so bumped asset versions (app.js?v=, styles.css?v=)
    # take effect instead of a cached page pulling stale assets.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
