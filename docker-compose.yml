# mitigation-check: UI + API + Postgres as containers.
#
# The API launches the validation-substrate container on the host Docker daemon
# (mounted docker.sock) and attaches it to the shared `mitigation-net` network,
# reaching it by name. The run ledger lives in the `db` Postgres container; its
# data is on the named volume `pgdata`, which survives `docker stop` and
# `docker rm` of the db container (only `docker compose down -v` deletes it).

services:
  db:
    image: postgres:16-alpine
    container_name: mitigation-db
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc
      POSTGRES_DB: mitigation
    volumes:
      - pgdata:/var/lib/postgresql/data      # durable ledger data
    networks:
      - mitnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mitigation"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    image: mitigation-check-api
    container_name: mitigation-api
    environment:
      PORT: "8137"
      DATABASE_URL: postgres://mc:mc@db:5432/mitigation?sslmode=disable
      MC_SUBSTRATE_NETWORK: mitigation-net
      # GitHub Actions execution mode (optional). Set in a local .env file.
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WORKFLOW: ${GITHUB_WORKFLOW:-mitigation-check.yml}
      GITHUB_REF: ${GITHUB_REF:-main}
      # Azure ACI execution mode (optional).
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
      MC_ACI_RESOURCE_GROUP: ${MC_ACI_RESOURCE_GROUP:-}
      MC_ACI_REGION: ${MC_ACI_REGION:-}
    ports:
      - "8137:8137"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock    # launch substrate containers
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mitnet
    restart: unless-stopped

  ui:
    build: ./ui
    image: mitigation-check-ui
    container_name: mitigation-ui
    ports:
      - "8082:80"
    depends_on:
      - api
    networks:
      - mitnet
    restart: unless-stopped

volumes:
  pgdata:

networks:
  mitnet:
    name: mitigation-net
