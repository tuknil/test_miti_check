name: CI - Go Build

on:
  schedule:
    - cron: '00 02 * * *'

  push:
    branches: [ "main" ]

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "main" ]

  workflow_dispatch:
    ## This workflow can be manually triggered via the GitHub UI.
    ## The inputs defined below determine the steps to execute.
    ## The `default` value specifies the initial option displayed in the UI only.
    inputs:
      enable_sonar:
        description: 'Enable Sonar'
        default: false
        required: true
        type: boolean
      enable_veracode_sast:
        description: 'Enable VeraCode SAST'
        default: false
        required: true
        type: boolean
      enable_veracode_sca:
        description: 'Enable VeraCode SCA'
        default: false
        required: true
        type: boolean
      enable_veracode_pipeline_scan:
        description: 'Enable VeraCode Pipeline Scan'
        default: false
        required: false
        type: boolean
      enable_unit_tests:
        description: 'Enable Unit Tests'
        default: false
        required: true
        type: boolean
      enable_deployment:
        description: 'Enable Deployment'
        default: false
        required: true
        type: boolean
      log_level:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug

jobs:
  lifecycle-postgres:
    name: Go tests with durable PostgreSQL
    runs-on: concordia-linux-cpu2-ram7gi
    services:
      postgres:
        image: artifact.it.att.com/astra-secure-container-catalog/postgresql:17.10-r1@sha256:c2ceffcba898b179fccfb526396f301a965fbd895d2b28e5484ed62789fac042
        credentials:
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_ACCESS_TOKEN }}
        env:
          POSTGRES_USER: mc
          POSTGRES_PASSWORD: mc
          POSTGRES_DB: mitigation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mc -d mitigation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MC_TEST_DATABASE_URL: postgres://mc:mc@localhost:5432/mitigation?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Test all Go packages with PostgreSQL lifecycle coverage
        working-directory: api
        run: go test ./...
      - name: Vet all Go packages
        working-directory: api
        run: go vet ./...

  run:
    name: Run Go CI Workflow
    secrets: inherit
    uses: ATT-IDP/revup-workflows/.github/workflows/reusable_workflow_go_ci.yaml@v5
    with:
      enable_sonar: ${{ github.event.inputs.enable_sonar }}
      enable_veracode_sast: ${{ github.event.inputs.enable_veracode_sast }}
      enable_veracode_sca: ${{ github.event.inputs.enable_veracode_sca }}
      enable_veracode_pipeline_scan: ${{ github.event.inputs.enable_veracode_pipeline_scan }}
      enable_unit_tests: ${{ github.event.inputs.enable_unit_tests }}
      enable_deployment: ${{ github.event.inputs.enable_deployment }}
      log_level: ${{ github.event.inputs.log_level }}
      runner_group: 'concordia-linux-cpu2-ram7gi'
      